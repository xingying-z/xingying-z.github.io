<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="45%" stop-color="#1b1140"/>
      <stop offset="75%" stop-color="#2a1247"/>
      <stop offset="100%" stop-color="#07080f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b5cff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#5b3bd6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5b3bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ee6c5" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#1fa8a0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#1fa8a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5fa2" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#c33a7a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c33a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="overlay"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <g filter="url(#soft)">
    <ellipse cx="520" cy="330" rx="430" ry="300" fill="url(#glow1)"/>
    <ellipse cx="1480" cy="760" rx="480" ry="330" fill="url(#glow2)"/>
    <ellipse cx="1180" cy="190" rx="330" ry="230" fill="url(#glow3)"/>
  </g>

  <!-- 远处的山脊剪影 -->
  <path d="M0 830 L210 690 L360 780 L540 650 L720 800 L900 720 L1080 840 L1260 730 L1450 820 L1650 700 L1920 830 L1920 1080 L0 1080 Z"
        fill="#0a0a16" opacity="0.75"/>
  <path d="M0 920 L260 810 L470 880 L700 790 L940 900 L1180 820 L1420 910 L1680 830 L1920 900 L1920 1080 L0 1080 Z"
        fill="#05050c" opacity="0.9"/>

  <!-- 星点 -->
  <g fill="#ffffff">
    <circle cx="180" cy="150" r="1.6" opacity="0.8"/>
    <circle cx="420" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="700" cy="170" r="1.4" opacity="0.7"/>
    <circle cx="980" cy="80" r="1.1" opacity="0.55"/>
    <circle cx="1300" cy="130" r="1.7" opacity="0.75"/>
    <circle cx="1620" cy="90" r="1.3" opacity="0.6"/>
    <circle cx="1780" cy="240" r="1.2" opacity="0.5"/>
    <circle cx="260" cy="430" r="1.1" opacity="0.45"/>
    <circle cx="1520" cy="400" r="1.3" opacity="0.5"/>
    <circle cx="860" cy="300" r="1.2" opacity="0.5"/>
    <circle cx="1120" cy="470" r="1.1" opacity="0.4"/>
    <circle cx="640" cy="520" r="1.2" opacity="0.4"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vig)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.9"/>
</svg>
