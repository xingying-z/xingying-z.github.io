<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · 页面走丢了</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #fff; text-align: center; overflow: hidden;
      background: #0b1026 url("/img/bg.svg") center / cover no-repeat;
    }
    body::after {
      content: ""; position: fixed; inset: 0; background: rgba(5, 6, 14, .55);
    }
    .wrap { position: relative; z-index: 1; padding: 24px; }
    .code {
      font-size: clamp(88px, 18vw, 180px); font-weight: 800; line-height: 1;
      background: linear-gradient(120deg, #a78bfa, #22d3c5 70%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      letter-spacing: -.02em;
    }
    h1 { font-size: clamp(18px, 3vw, 26px); font-weight: 600; margin: 8px 0 10px; }
    p { color: rgba(255,255,255,.65); font-size: 15px; margin-bottom: 28px; }
    a {
      display: inline-block; padding: 11px 26px; border-radius: 999px;
      color: #fff; text-decoration: none; font-size: 15px;
      background: linear-gradient(120deg, #7b5cff, #22d3c5);
      box-shadow: 0 8px 24px rgba(123, 92, 255, .35);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(34, 211, 197, .35); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>可能链接写错了，也可能这篇文章已经被我删掉了。</p>
    <a href="/">回到首页</a>
  </div>
</body>
</html>
